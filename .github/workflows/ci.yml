name: ci
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest tests/ -q
      - run: python -m compileall -q scripts tests
      - run: python scripts/generate_data.py --task tasks/human_handoff/task.toml
      - run: python scripts/validate_data.py --task tasks/human_handoff/task.toml
      - run: python scripts/generate_data.py --task tasks/moderation/task.toml
      - run: python scripts/validate_data.py --task tasks/moderation/task.toml
