# TEMPORARY kill-resume probe task. Verifies checkpoint save/resume on a
# tiny CPU run. Deleted after verification; never committed.
[task]
name = "resume_probe"
tools = "tools.json"
slot_banks = "slot_banks.json"
seed_bank = "seeds_train.jsonl"
eval_bank = "seeds_eval.jsonl"
out_dir = "out"

[data]
languages = ["en"]
categories = ["explicit", "negative"]
train_per_cell = 2
eval_per_cell = 1
negative_ratio_min = 0.05
negative_ratio_max = 0.9
train_seed = 7
max_variants_per_seed = 12
train_file = "train.jsonl"
eval_file = "eval.jsonl"
manifest_file = "manifest.json"
max_len_tokens = 1024
fragmentation_warning = 1.7

[train]
backend = "cpu"
epochs = 600
batch_size = 4
lr = 0.0001
lora_rank = 16
lora_alpha = 32
max_len = 1024
val_split = 0.25
seed = 0
adapter_file = "adapter.safetensors"
log_file = "train.log"
save_every_min = 1

[build]
layers = 20
weights_file = "probe_20l.cact"

[eval]
report_file = "eval_report.json"

[kaggle]
username = "blonded2"
gpu = false
input_dataset = "needle3-resume-probe-input"
output_dataset = "needle3-resume-probe-outputs"
checkpoints_dataset = "needle3-resume-probe-checkpoints"
kernel = "needle3-resume-probe"
accelerator = "NvidiaTeslaT4"
timeout = 10800
# Raised for the resume run: ~90 min remain after the step-44 kill.
stage_timeout = 7200
poll_interval = 60
poll_timeout = 10800
backend = "cpu"
batch_size = 4
publish_files = ["adapter.safetensors"]
