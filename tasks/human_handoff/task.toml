# Human-handoff finetune task for Needle 3.
# Every value a script needs lives here (agents2.md Rule 1). Origins for
# training defaults are the Fine-tuning Needle guide:
# https://cactuscompute.com/blog/finetuning-needle

[task]
name = "human_handoff"
tools = "tools.json"
slot_banks = "slot_banks.json"
seed_bank = "seeds_train.jsonl"
eval_bank = "seeds_eval.jsonl"
out_dir = "out"

[data]
languages = ["en", "de", "fr", "es", "it", "nl", "pl"]
categories = ["explicit", "implicit", "sarcastic", "multisentence", "edge", "negative"]
# Minimum train examples per (language, category) cell after expansion.
train_per_cell = 20
# Exact eval examples per (language, category) cell, from the eval bank only.
eval_per_cell = 6
# Off-topic [] share. Origin: finetuning guide, "the built-in generator
# produces about one in eight". Ceiling raised to 0.18 in round 5: refusal
# quality gates the 96% target and measured 95-100% at ~16% negatives.
negative_ratio_min = 0.10
negative_ratio_max = 0.18
train_seed = 7
# Cap on expanded variants per seed; guards against slot-product explosion.
max_variants_per_seed = 12
train_file = "train.jsonl"
eval_file = "eval.jsonl"
manifest_file = "manifest.json"
# Must match [train] max_len. Origin: finetuning guide default 1024; longer
# examples are silently truncated, so validation warns near the cap.
max_len_tokens = 1024
# Origin: finetuning guide, non-English fragments into ~1.7x tokens
# (measured on Spanish). Used only for length warnings.
fragmentation_warning = 1.7

[train]
# All defaults below are the finetuning guide defaults unless noted.
# backend cpu: the 20-layer fp32 train step OOMs on this 4 GB GTX 1650
# (RESOURCE_EXHAUSTED at CUBIN load even at batch 4; measured 2026-11-10).
backend = "cpu"
# Persistent XLA compilation cache: a restarted run reloads the compiled
# train step instead of recompiling (the trainer itself saves only the
# final adapter, so step progress itself cannot resume).
jax_cache_dir = "out/jax_cache"
# 14 epochs: round-4 attempt 1 finished all 15 epochs but the stage
# timeout fired during final scoring/save (2385 steps at ~7.5 s/step
# overran 5h); val was flat 0.0203-0.0208 over epochs 13-15, so 14 loses
# nothing measurable and fits with margin.
epochs = 14
# batch 4, not the guide default 16: XLA CPU compile at batch 16 grew past
# 8.6 GB RSS (global OOM kill) and at batch 8 past the 6 GB cgroup ceiling
# (cgroup-scoped kill, box untouched; both measured 2026-11-10). Last local
# lever: if batch 4 also exceeds 6 GB, this box cannot train Needle 3
# 20-layer LoRA and the run moves to the platform path or a bigger machine.
batch_size = 4
lr = 0.0001
# Rank 128 (round 18): rank 64 saturated - v13-v17 oscillate 220-227 with
# conserved error mass (~30; fixes displace neighbors waterbed-style).
# Same data as round 17; one variable.
lora_rank = 128
lora_alpha = 128
max_len = 1024
val_split = 0.1
seed = 0
# 0 skips in-loop holdout scoring: on 2xT4 the eval executable OOMs next
# to the pmap train state (v16, first eval call). Diagnostic-only loss —
# evaluate.py scores the holdout for real. Restore 1 on a bigger GPU.
val_every = 0
adapter_file = "adapter.safetensors"
log_file = "train.log"
# Minutes between training checkpoints (kaggle_train_loop.py). A killed
# run loses at most this much work; a re-push with --resume continues.
# Lives in [train]: the driver reads it from there alongside the other
# loop argv keys (it was briefly misplaced under [kaggle], which failed
# the driver's config guard on Kaggle despite a fresh dataset).
save_every_min = 30

[build]
# Full model. Origin: owner decision; CLI default is 20 (cactus build --help).
layers = 20
weights_file = "handoff_20l.cact"

[eval]
# DroidCall-style exact-calls-in-order scoring; see scripts/evaluate.py.
report_file = "eval_report.json"

[kaggle]
# Owner for dataset/kernel refs. Origin: `kaggle config view` on this box.
username = "blonded2"
# Set false for CPU-only probe kernels (saves GPU quota); training runs
# stay on GPU.
gpu = true
input_dataset = "needle3-handoff-input"
output_dataset = "needle3-handoff-outputs"
checkpoints_dataset = "needle3-handoff-checkpoints"
kernel = "needle3-handoff-train"
# GPU type for the kernel run (metadata machine_shape).
accelerator = "NvidiaTeslaT4"
# Hard cap on the kernel run in seconds; the server bounds it further.
timeout = 21600
# Per-stage cap in seconds. Disabled (0): fixed caps kept killing healthy
# slow runs (3h mid-train, 5h during final scoring). The 6h kernel timeout
# stays the outer backstop, and 30-min checkpoints bound any kill's cost.
stage_timeout = 0
poll_interval = 60
poll_timeout = 25200
# Train settings used on Kaggle (override the weak-box [train] values).
# The driver reads these from the mounted task.toml (Kaggle runs it
# with no argv); explicit driver CLI args still win for local/test use.
backend = "gpu"
# 32, not the guide default 16: halves the step count (~1.3-1.5x faster
# wall-clock). T4 fit unvalidated before round 6 — an OOM fails loud in
# the finetune stage, and the fix is reverting to 16, not a code change.
batch_size = 32
# Warm-start the LoRA weights from the prior round's published adapter
# (mounts the outputs dataset; the driver dies loud when no adapter is
# mounted). False for from-scratch rounds; true only for a follow-up
# round reusing the previous round's adapter. Never with --resume.
warm_start = false
# Output files published to the binaries dataset (relative to out/).
publish_files = ["adapter.safetensors", "handoff_20l.cact", "eval_report.json", "train.log", "manifest.json", "train.jsonl", "eval.jsonl"]
